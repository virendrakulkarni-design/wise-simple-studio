<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Wise Simple Studio — Approach A: Gemini Vision DNA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="styles.css?v=4.8.0-vision" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* Top Endpoint Switcher Bar */
    .endpoint-switcher {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: rgba(11, 15, 25, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .endpoint-switcher-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .endpoint-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .endpoint-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c084fc;
      box-shadow: 0 0 10px rgba(192, 132, 252, 0.8);
      animation: pulseDot 2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .endpoint-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .endpoint-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(168, 85, 247, 0.18);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .endpoint-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .endpoint-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #161f30;
      color: #94a3b8;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .endpoint-btn:hover {
      background: #1e293b;
      color: #f8fafc;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .endpoint-btn.active {
      background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
      color: #ffffff;
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 2px 10px rgba(168, 85, 247, 0.4);
    }
    @media (max-width: 768px) {
      .endpoint-switcher {
        padding: 6px 12px;
      }
      .endpoint-switcher-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .endpoint-btn {
        font-size: 11px;
        padding: 4px 9px;
      }
    }
  </style>
</head>
<body>
  <nav class="endpoint-switcher">
    <div class="endpoint-switcher-inner">
      <div class="endpoint-left">
        <span class="endpoint-pulse"></span>
        <span class="endpoint-label">Active Endpoint:</span>
        <span class="endpoint-badge"><i class="ti ti-scan"></i> Approach A: Gemini Vision DNA</span>
      </div>
      <div class="endpoint-nav">
        <a href="../" class="endpoint-btn" title="Main Standard Flux Pipeline">
          <i class="ti ti-bolt"></i> Main
        </a>
        <a href="./" class="endpoint-btn active" title="Approach A: Multimodal Character DNA extraction via Gemini 1.5 Flash Vision">
          <i class="ti ti-scan"></i> Approach A (Vision DNA)
        </a>
        <a href="../ipadapter/" class="endpoint-btn" title="Approach B: Hardware Character Conditioning via Replicate IP-Adapter">
          <i class="ti ti-cpu"></i> Approach B (IP-Adapter)
        </a>
      </div>
    </div>
  </nav>

  <div id="app"></div>
  <script src="app.js?v=4.8.0-vision"></script>
</body>
</html>
