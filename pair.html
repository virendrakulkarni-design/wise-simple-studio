<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect to Antigravity IDE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .card { background: #161f30; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px 24px; max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; margin-bottom: 12px; transition: transform 0.1s, opacity 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: #fff; box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
    .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); }
    .btn-copy { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .token-box { background: #0b0f19; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px; font-family: monospace; font-size: 12px; color: #38bdf8; word-break: break-all; margin: 16px 0; }
    .status-msg { font-size: 12px; color: #f59e0b; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚀</div>
    <h1>Connect to Desktop IDE</h1>
    <p>Opening Antigravity Companion App automatically on your device...</p>

    <div class="token-box" id="tokenDisplay">Loading token...</div>

    <a id="btnPrimary" href="#" class="btn btn-primary">Tap to Open in Antigravity App</a>
    <a id="btnAlt" href="#" class="btn btn-secondary">Try Alternate App Link</a>
    <button class="btn btn-copy" onclick="copyToken()">📋 Copy Pairing Token</button>

    <div class="status-msg" id="statusMsg">If the app didn't open automatically, tap the button above.</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '304b5386-cfed-445b-a69f-b7f034bd9671';
    const authId = '4a29d644-8392-4d2a-9a68-f4f4146ff7e1';

    document.getElementById('tokenDisplay').textContent = token;

    // Schemes to try
    const scheme1 = `antigravity://uladluch.antigravity-mobile-connector/connect?token=${token}`;
    const scheme2 = `vscode://uladluch.antigravity-mobile-connector/connect?token=${token}`;
    const scheme3 = `antigravity://connect?token=${token}`;

    document.getElementById('btnPrimary').href = scheme1;
    document.getElementById('btnAlt').href = scheme2;

    // Auto-launch on load
    window.addEventListener('load', () => {
      // Try opening the app immediately via primary URL scheme
      setTimeout(() => {
        window.location.href = scheme1;
      }, 300);

      // Fallback try scheme 2 if user is still on page after 1.5s
      setTimeout(() => {
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = scheme2;
        document.body.appendChild(iframe);
      }, 1500);
    });

    function copyToken() {
      navigator.clipboard.writeText(token).then(() => {
        const btn = event.target;
        btn.textContent = '✅ Token Copied!';
        setTimeout(() => btn.textContent = '📋 Copy Pairing Token', 2500);
      });
    }
  </script>
</body>
</html>
